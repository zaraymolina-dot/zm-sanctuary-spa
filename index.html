<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZM Sanctuary | Wellness & Balance</title>

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --spa-base: #fff9f6;
      --spa-sand: #f5e5d7;
      --spa-rose: #f2e2df;
      --spa-terra: #c59d93;
      --spa-text: #5d4037;
      --spa-accent: #d4b996;
      --spa-soft: #fef5ef;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Lato", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #fff6f2 0, #fff9f6 45%, #fff7f3 100%);
      color: var(--spa-text);
      line-height: 1.6;
    }

    img {
      max-width: 100%;
      display: block;
    }

    .page {
      min-height: 100vh;
    }

    .container {
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* NAVBAR --------------------------------------------------- */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255, 248, 244, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(213, 189, 171, 0.35);
    }

    .navbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 72px;
    }

    .nav-links {
      display: flex;
      gap: 32px;
      font-size: 14px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #c39a8e;
    }

    .nav-links a {
      text-decoration: none;
      color: inherit;
    }

    .nav-links a:hover {
      color: var(--spa-terra);
    }

    .nav-center {
      font-family: "Playfair Display", serif;
      letter-spacing: 0.22em;
      font-size: 18px;
      color: #7b5247;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 28px;
      font-size: 14px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #c39a8e;
    }

    .nav-right span {
      cursor: default;
    }

    .btn-outline {
      padding: 10px 26px;
      border-radius: 999px;
      border: 1px solid #e2b9aa;
      color: #b57f6f;
      background: transparent;
      text-decoration: none;
      font-size: 14px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      transition: all 0.2s ease;
    }

    .btn-outline:hover {
      background: #fce9df;
    }

    /* HERO ----------------------------------------------------- */
    .hero {
      padding: 72px 0 96px;
    }

    .hero-inner {
      position: relative;
      max-width: 980px;
      margin: 0 auto;
